<text x="50" y="338" font-size="12" fill="#002244" font-weight="700">data/betbot.sqlite (schema v11)</text>
<text x="50" y="353" font-size="12" fill="#101820">odds_snapshots 225,932 rows (189,420 closes, 26,643 live, 9,869 pages)</text>
<text x="50" y="368" font-size="12" fill="#101820">the ledger: bets, bet_legs, bankroll_transactions, fanduel_activity, tokens</text>
<text x="50" y="383" font-size="12" fill="#101820">cards, card_lines, paper_snapshots, paper_lines</text>
<text x="50" y="398" font-size="12" fill="#101820">additive only: nothing is ever deleted; every import de-duplicated</text>

<text x="750" y="390" font-size="12" fill="#101820">week 1 carried forward from each player's last game of last season</text>

<text x="390" y="560" font-size="12" fill="#101820">calibration curves for one-sided markets</text>
<text x="390" y="576" font-size="12" fill="#101820">(anytime TD, sacks) from the 2025 closes</text>
<rect x="740" y="509.5" width="250" height="93" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="750" y="530" font-size="12" fill="#002244" font-weight="700">player_props-1.1.0 (LIVE)</text>
<text x="750" y="546" font-size="12" fill="#101820">LightGBM mean per market, 11 markets</text>
<text x="750" y="560" font-size="12" fill="#101820">yards log-normal; counts negative</text>
<text x="750" y="576" font-size="12" fill="#101820">binomial; anytime TD Poisson to binary</text>
<text x="750" y="590" font-size="12" fill="#101820">pre-kickoff usage floors</text>
<rect x="1010" y="517.0" width="230" height="78" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="1020" y="538" font-size="12" fill="#002244" font-weight="700">game_lines-1.1.0</text>
<text x="1020" y="553" font-size="12" fill="#101820">margin and total as Normals</text>
<text x="1020" y="568" font-size="12" fill="#101820">closing spread / total as inputs</text>
<text x="1020" y="583" font-size="12" fill="#101820">out-of-sample residual scale; referee</text>
<rect x="1260" y="524.5" width="220" height="63" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>

<text x="1270" y="560" font-size="12" fill="#101820">Gaussian copula over measured</text>
<text x="1270" y="576" font-size="12" fill="#101820">leg correlations (5,125 team-games)</text>
<rect x="1500" y="509.5" width="365" height="93" rx="5" fill="#FFFFFF" stroke="#FB4F14" stroke-width="1.8" stroke-dasharray="6 3"/>
<text x="1510" y="530" font-size="12" fill="#002244" font-weight="700">Game day, typed or saved by hand</text>

<text x="1510" y="560" font-size="12" fill="#101820">matchups_today.txt, referees_week.txt</text>
<text x="1510" y="576" font-size="12" fill="#101820">the Rewards page for the tokens (menu 3)</text>
<text x="1510" y="590" font-size="12" fill="#101820">never scraped</text>

<text x="50" y="723" font-size="12" fill="#002244" font-weight="700">RULES: config/settings.toml</text>
<text x="50" y="738" font-size="12" fill="#101820">Kelly 0.25 on the current roll</text>
<text x="50" y="753" font-size="12" fill="#101820">caps 4% a bet, 80% a week,</text>
<text x="50" y="768" font-size="12" fill="#101820">10% one-sided; min edge 1.0</text>
<text x="50" y="783" font-size="12" fill="#101820">band 25-75%; blend 0.50 / 0.30</text>
<text x="50" y="798" font-size="12" fill="#101820">changed only at a settle (D18)</text>
<rect x="245" y="709.5" width="185" height="93" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="255" y="730" font-size="12" fill="#002244" font-weight="700">The board</text>
<text x="255" y="746" font-size="12" fill="#101820">the latest FanDuel snapshot</text>
<text x="255" y="760" font-size="12" fill="#101820">inside a time window;</text>
<text x="255" y="776" font-size="12" fill="#101820">a moved line is never</text>
<text x="255" y="790" font-size="12" fill="#101820">priced as still offered</text>
<rect x="450" y="709.5" width="185" height="93" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="460" y="730" font-size="12" fill="#002244" font-weight="700">Price each selection</text>
<text x="460" y="746" font-size="12" fill="#101820">FanDuel price &gt; break-even</text>
<text x="460" y="760" font-size="12" fill="#101820">&gt; no-vig (both sides)</text>
<text x="460" y="776" font-size="12" fill="#101820">&gt; model probability</text>
<text x="460" y="790" font-size="12" fill="#101820">&gt; blend &gt; edge and EV</text>
<rect x="655" y="702.0" width="185" height="108" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="665" y="723" font-size="12" fill="#002244" font-weight="700">Guards</text>
<text x="665" y="738" font-size="12" fill="#101820">band 25-75% on model AND</text>
<text x="665" y="753" font-size="12" fill="#101820">market; one-sided floor</text>
<text x="665" y="768" font-size="12" fill="#101820">0.20; role-change rule;</text>
<text x="665" y="783" font-size="12" fill="#101820">min edge; feature readiness</text>
<text x="665" y="798" font-size="12" fill="#101820">(every refusal says why)</text>
<rect x="860" y="709.5" width="185" height="93" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="870" y="730" font-size="12" fill="#002244" font-weight="700">size_stake</text>
<text x="870" y="746" font-size="12" fill="#101820">fractional Kelly on the roll</text>
<text x="870" y="760" font-size="12" fill="#101820">caps enforced; SGP half</text>
<text x="870" y="776" font-size="12" fill="#101820">fraction and $10; best EV</text>
<text x="870" y="790" font-size="12" fill="#101820">first; minimum acceptable price</text>
<rect x="1065" y="709.5" width="185" height="93" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="1075" y="730" font-size="12" fill="#002244" font-weight="700">Token optimizer</text>
<text x="1075" y="746" font-size="12" fill="#101820">each token where it adds</text>
<text x="1075" y="760" font-size="12" fill="#101820">the most EV (exact search)</text>
<text x="1075" y="776" font-size="12" fill="#101820">hold at most 2 bets for</text>
<text x="1075" y="790" font-size="12" fill="#101820">the T-30 second touch</text>
<rect x="1270" y="702.0" width="185" height="108" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="1280" y="723" font-size="12" fill="#002244" font-weight="700">The card</text>
<text x="1280" y="738" font-size="12" fill="#101820">card.html + card_lines</text>
<text x="1280" y="753" font-size="12" fill="#101820">ranked bets, SGP ladder,</text>
<text x="1280" y="768" font-size="12" fill="#101820">tokens, dies-if-inactive</text>
<text x="1280" y="783" font-size="12" fill="#101820">+ printouts: injury,</text>
<text x="1280" y="798" font-size="12" fill="#101820">matchups, defense</text>
<rect x="1475" y="709.5" width="185" height="93" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="1485" y="730" font-size="12" fill="#002244" font-weight="700">betbot serve (127.0.0.1)</text>
<text x="1485" y="746" font-size="12" fill="#101820">tick to confirm: one bets</text>
<text x="1485" y="760" font-size="12" fill="#101820">row per ticket, stake and</text>
<text x="1485" y="776" font-size="12" fill="#101820">price as actually got</text>
<text x="1485" y="790" font-size="12" fill="#101820">placement route page</text>
<rect x="1680" y="709.5" width="185" height="93" rx="28" fill="#FFFFFF" stroke="#FB4F14" stroke-width="2.2"/>
<text x="1690" y="730" font-size="12" fill="#002244" font-weight="700">YOU place every ticket</text>
<text x="1690" y="746" font-size="12" fill="#101820">by hand on FanDuel (D3)</text>
<text x="1690" y="760" font-size="12" fill="#101820">P Saturday, I at T-90,</text>
<text x="1690" y="776" font-size="12" fill="#101820">G at T-70, 5 verify,</text>
<text x="1690" y="790" font-size="12" fill="#101820">close at T-8</text>
<rect x="1590" y="902.0" width="275" height="108" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="1600" y="923" font-size="12" fill="#002244" font-weight="700">betbot grade (Monday 7 / 8)</text>
<text x="1600" y="938" font-size="12" fill="#101820">box scores &gt; results; closing</text>
<text x="1600" y="953" font-size="12" fill="#101820">line &gt; CLV (a diagnostic)</text>
<text x="1600" y="968" font-size="12" fill="#101820">Transaction History ties the</text>
<text x="1600" y="983" font-size="12" fill="#101820">roll to the cent; the operator's</text>
<text x="1600" y="998" font-size="12" fill="#101820">own rows: one aggregate line</text>
<rect x="1300" y="909.5" width="260" height="93" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="1310" y="930" font-size="12" fill="#002244" font-weight="700">Weekly report 2026_wNN.md</text>
<text x="1310" y="946" font-size="12" fill="#101820">calibration first: reliability by</text>
<text x="1310" y="960" font-size="12" fill="#101820">decile, largest gap, the Kelly</text>
<text x="1310" y="976" font-size="12" fill="#101820">gate's read; dollars second;</text>
<text x="1310" y="990" font-size="12" fill="#101820">card rows only (D10)</text>
<rect x="990" y="909.5" width="280" height="93" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="1000" y="930" font-size="12" fill="#002244" font-weight="700">Paper board (D19), league-wide</text>
<text x="1000" y="946" font-size="12" fill="#101820">every game priced by the same</text>
<text x="1000" y="960" font-size="12" fill="#101820">engine, graded, never bet;</text>
<text x="1000" y="976" font-size="12" fill="#101820">1,000+ lines over 4 weeks with</text>
<text x="1000" y="990" font-size="12" fill="#101820">largest gap &lt;= 5 pts opens the gate</text>
<rect x="660" y="909.5" width="300" height="93" rx="5" fill="#FFFFFF" stroke="#002244" stroke-width="1.2"/>
<text x="670" y="930" font-size="12" fill="#002244" font-weight="700">Studies and the regression matrix</text>
<text x="670" y="946" font-size="12" fill="#101820">on the 2025 closes, no credits:</text>
